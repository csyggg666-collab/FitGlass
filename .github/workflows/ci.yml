name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Pure-Foundation parsing logic — no Xcode/simulator needed, fast.
  parsing-tests:
    name: PlanParsingKit unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: PlanParsingKit
        run: swift test

  # Generate the Xcode project from project.yml and compile the app.
  build:
    name: Build app
    runs-on: macos-latest   # bump to macos-26 once the image ships, if needed
    steps:
      - uses: actions/checkout@v4

      # iOS 26.5 SDK needs Xcode 26.x. `latest-stable` picks the newest installed;
      # pin to '26.5' explicitly once the runner image provides it.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project FitGlass.xcodeproj \
            -scheme FitGlass \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # Build an UNSIGNED device .ipa and upload it as an artifact, so it can be
  # sideloaded onto an iPhone with a free Apple ID (e.g. Sideloadly on Windows).
  package-ipa:
    name: Unsigned .ipa (sideload)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned, device)
        run: |
          xcodebuild build \
            -project FitGlass.xcodeproj \
            -scheme FitGlass \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package into Payload/*.ipa
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "FitGlass.app" -type d | head -1)
          echo "App: $APP"
          test -n "$APP" || { echo "FitGlass.app not found"; exit 1; }
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -r -y FitGlass-unsigned.ipa Payload >/dev/null)
          ls -lh "$RUNNER_TEMP/FitGlass-unsigned.ipa"
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: FitGlass-unsigned-ipa
          path: ${{ runner.temp }}/FitGlass-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
